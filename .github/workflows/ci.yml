name: Clarity CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Pytest & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Backend Unit Tests
        run: |
          pytest tests/ -v
        env:
          ENVIRONMENT: test
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'mock_test_key_ci' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://mock.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'mock_service_key' }}

  frontend-tests:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Run Client Unit Tests
        run: |
          cd client
          npm test

      - name: Validate Next.js Build
        run: |
          cd client
          npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://clarity-6k7g.onrender.com/api
